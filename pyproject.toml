[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dioscorides-reader"
version = "0.10.2-alpha"
description = "Static parallel reading of immutable Dioscorides editions"
requires-python = ">=3.12"
dependencies = ["lxml>=5,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
dioscorides-reader = "dioscorides_reader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/dioscorides-reader/web" = ["web/diplomatic.css", "web/diplomatic.html", "web/diplomatic.js", "web/mobile.css", "web/mobile.js", "web/reader.css", "web/reader.html", "web/reader.js"]
"share/dioscorides-reader/web/vendor" = ["web/vendor/README.md"]
"share/dioscorides-reader/web/vendor/openseadragon" = ["web/vendor/openseadragon/LICENSE.txt", "web/vendor/openseadragon/openseadragon.min.js"]
